<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Festival - CrowdWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .festival-tile {
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      border-radius: 24px;
      color: #FFFFFF;
      cursor: pointer;
      border: 4px solid transparent;
      transition: transform 0.2s ease, filter 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .festival-tile:hover {
      transform: translateY(-4px);
      filter: brightness(1.05);
    }
    .festival-tile.active-fest {
      border-color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }
    .motif-stamp {
      position: absolute;
      top: -15px;
      right: -15px;
      font-size: 5rem;
      opacity: 0.18;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="header-motif-bar"></div>
  <header class="app-header">
    <div class="d-flex align-items-center gap-2">
      <span class="app-logo">CrowdWise</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-secondary px-3 py-2" data-i18n="step_festivals">Step 1 of 3</span>
      <button id="btn-lang-toggle" class="lang-toggle-btn">हिन्दी</button>
    </div>
  </header>

  <main class="container py-4">
    <div class="mb-4">
      <h1 class="display-5" data-i18n="select_fest_heading">Select Your Festival</h1>
      <p class="fs-5 text-secondary fw-semibold" data-i18n="select_fest_sub">Pick a festival to adapt themes, routes, and schedules.</p>
    </div>

    <div class="row g-4" id="festival-grid"></div>
  </main>

  <a href="emergency.html" class="lost-floating-action">
    <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg>
    <span data-i18n="btn_lost_help">Lost Child / Companion Help</span>
  </a>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/choose-festival.js"></script>
</body>
</html>
