<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CrowdWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="split-login-bg">
  <header class="app-header">
    <a href="index.html" class="app-logo">CrowdWise</a>
    <button id="btn-lang-toggle" class="lang-toggle-btn" aria-label="Switch Language">हिन्दी</button>
  </header>

  <main class="container py-4 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="colour-block login-card p-4 p-md-5">
          <h2 class="h1 mb-2" data-i18n="reg_heading">Join CrowdWise</h2>
          <p class="text-secondary fw-bold mb-4" data-i18n="reg_sub">Save family cards and favourite calm routes.</p>

          <form id="register-form">
            <div id="reg-error" class="alert alert-danger d-none py-2 px-3 fw-bold mb-3"></div>

            <div class="mb-3">
              <label for="reg-name" class="form-label" data-i18n="name_label">Full Name</label>
              <input type="text" class="form-control" id="reg-name" required>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label" data-i18n="email_label">Email address</label>
              <input type="email" class="form-control" id="reg-email" required>
            </div>

            <div class="mb-3">
              <label for="reg-pass" class="form-label" data-i18n="password_label">Password</label>
              <input type="password" class="form-control" id="reg-pass" required minlength="6">
            </div>

            <div class="mb-4">
              <label for="reg-confirm-pass" class="form-label" data-i18n="confirm_pass_label">Confirm Password</label>
              <input type="password" class="form-control" id="reg-confirm-pass" required minlength="6">
            </div>

            <button type="submit" class="colour-btn btn-mocha mb-3" data-i18n="btn_register">Create Free Account</button>
            
            <div class="text-center fw-bold mt-3">
              <span data-i18n="already_user">Already have an account?</span>
              <a href="index.html" class="text-decoration-none ms-1" style="color: var(--mocha-brown);" data-i18n="sign_in_link">Sign in here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
