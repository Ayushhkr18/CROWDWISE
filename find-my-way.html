<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Way - CrowdWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .map-container {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 1.25rem;
      position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .svg-map {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #FAFAFA;
    }
    .route-chip-btn {
      border: none;
      background: var(--platinum-silver);
      color: var(--near-black);
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .route-chip-btn.active {
      background: var(--near-black);
      color: #FFFFFF;
    }
    .metric-box {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 1rem;
      text-align: center;
      flex: 1;
    }
    .zone-rect { transition: fill 0.4s ease; }
    .route-path-polyline {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: dashAnim 20s linear infinite;
    }
    @keyframes dashAnim {
      to { stroke-dashoffset: -1000; }
    }
  </style>
</head>
<body>
  <div class="header-motif-bar"></div>
  <header class="app-header">
    <a href="home.html" class="colour-btn py-1 px-3 fs-6" style="width: auto; background: var(--platinum-silver); color: var(--near-black);" data-i18n="back">Back</a>
    <span class="app-logo">CrowdWise</span>
    <button id="btn-lang-toggle" class="lang-toggle-btn">हिन्दी</button>
  </header>

  <main class="container py-4">
    <div class="mb-4">
      <h1 class="display-5" data-i18n="map_heading">Find My Way</h1>
      <p class="fs-5 text-secondary fw-semibold" data-i18n="map_sub">Step-free SVG map and route recommendations.</p>
    </div>

    <div class="d-flex gap-2 overflow-x-auto pb-2 mb-3" role="tablist" aria-label="Route Selection">
      <button class="route-chip-btn" data-route="shortest" data-i18n="route_chip_shortest">Shortest</button>
      <button class="route-chip-btn" data-route="comfort" data-i18n="route_chip_comfort">Comfort</button>
      <button class="route-chip-btn" data-route="calm" data-i18n="route_chip_calm">Calm</button>
      <button class="route-chip-btn" data-route="accessible" data-i18n="route_chip_accessible">Wheelchair-Friendly</button>
    </div>

    <div class="map-container mb-4">
      <svg id="venue-svg" class="svg-map" viewBox="0 0 700 280" aria-label="Interactive venue ground map">
        <defs>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
          </filter>
        </defs>
        <g id="svg-zones"></g>
        <path id="svg-active-route" class="route-path-polyline" d="" stroke="#FF7A3D" stroke-width="6" stroke-dasharray="10, 6" />
        <g id="svg-points"></g>
      </svg>
    </div>

    <div class="colour-block p-3 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-2" style="background-color: var(--platinum-silver);">
      <span class="fw-bold small text-secondary" data-i18n="accessible_legend_title">Accessibility Landmarks:</span>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="badge bg-white text-dark p-2 border">♿ Ramp</span>
        <span class="badge bg-white text-dark p-2 border">🛗 Lift</span>
        <span class="badge bg-white text-dark p-2 border">🚻 Accessible Restroom</span>
        <span class="badge bg-white text-dark p-2 border">ℹ️ Wheelchair Desk</span>
      </div>
    </div>

    <div class="d-flex gap-2 flex-wrap mb-4">
      <div class="metric-box">
        <span class="text-secondary small fw-bold" data-i18n="metric_walk_time">Walk Time</span>
        <h3 class="h4 m-0 mt-1 fw-bold text-dark" id="metric-walk-time">-- min</h3>
      </div>
      <div class="metric-box">
        <span class="text-secondary small fw-bold" data-i18n="metric_crowd">Crowd Density</span>
        <h3 class="h4 m-0 mt-1 fw-bold text-dark" id="metric-crowd">--</h3>
      </div>
      <div class="metric-box">
        <span class="text-secondary small fw-bold" data-i18n="metric_step_free">Step-Free</span>
        <h3 class="h4 m-0 mt-1 fw-bold text-success" id="metric-step-free">Yes</h3>
      </div>
      <div class="metric-box">
        <span class="text-secondary small fw-bold" data-i18n="metric_rest_stops">Rest Stops</span>
        <h3 class="h4 m-0 mt-1 fw-bold text-dark" id="metric-rest-stops">--</h3>
      </div>
    </div>

    <button id="btn-focus-family" class="colour-btn mb-2" style="background-color: var(--mustard); color: var(--near-black);" data-i18n="btn_focus_meeting">
      Take Me to Family Meeting Point
    </button>
  </main>

  <a href="emergency.html" class="lost-floating-action">
    <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg>
    <span data-i18n="btn_lost_help">Lost Child / Companion Help</span>
  </a>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/find-my-way.js"></script>
</body>
</html>
