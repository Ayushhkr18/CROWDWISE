<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Feedback - CrowdWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .star-rating {
      font-size: 2.4rem;
      cursor: pointer;
      color: rgba(20, 18, 17, 0.2);
      user-select: none;
    }
    .star-rating.active { color: var(--mustard); }
    .pill-btn {
      min-height: 48px;
      border-radius: 16px;
      font-weight: 700;
      border: 2px solid rgba(20, 18, 17, 0.15);
      background: #FFFFFF;
      cursor: pointer;
      flex: 1;
    }
    .pill-btn.active { background: var(--near-black); color: #FFFFFF; border-color: var(--near-black); }
  </style>
</head>
<body>
  <div class="header-motif-bar"></div>
  <header class="app-header">
    <a href="home.html" class="colour-btn py-1 px-3 fs-6" style="width: auto; background: var(--platinum-silver); color: var(--near-black);" data-i18n="back">Back</a>
    <span class="app-logo">CrowdWise</span>
    <button id="btn-lang-toggle" class="lang-toggle-btn">हिन्दी</button>
  </header>

  <main class="container py-4 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div id="feedback-form-card" class="colour-block p-4 p-md-5" style="background-color: #FFFFFF;">
          <h1 class="display-6 mb-2" data-i18n="feedback_heading">Share Your Experience</h1>
          <p class="fs-6 text-secondary fw-semibold mb-4" data-i18n="feedback_sub">Help enhance accessibility and flow for everyone.</p>

          <form id="feedback-form">
            <div class="mb-4 text-center">
              <label class="form-label d-block fw-bold fs-5 mb-2" data-i18n="fb_rating_label">How smooth was your experience today?</label>
              <div class="d-flex justify-content-center gap-2">
                <span class="star-rating active" data-val="1">★</span>
                <span class="star-rating active" data-val="2">★</span>
                <span class="star-rating active" data-val="3">★</span>
                <span class="star-rating active" data-val="4">★</span>
                <span class="star-rating active" data-val="5">★</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" data-i18n="fb_q1">Were the step-free ramps and routes clear?</label>
              <div class="d-flex gap-2">
                <button type="button" class="pill-btn active" data-q="q1" data-val="yes">Yes</button>
                <button type="button" class="pill-btn" data-q="q1" data-val="somewhat">Somewhat</button>
                <button type="button" class="pill-btn" data-q="q1" data-val="no">No</button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" data-i18n="fb_q2">Did you locate restrooms and water easily?</label>
              <div class="d-flex gap-2">
                <button type="button" class="pill-btn active" data-q="q2" data-val="yes">Yes</button>
                <button type="button" class="pill-btn" data-q="q2" data-val="somewhat">Somewhat</button>
                <button type="button" class="pill-btn" data-q="q2" data-val="no">No</button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label" data-i18n="fb_q3">Would you recommend this quiet hours tool?</label>
              <div class="d-flex gap-2">
                <button type="button" class="pill-btn active" data-q="q3" data-val="yes">Definitely</button>
                <button type="button" class="pill-btn" data-q="q3" data-val="maybe">Maybe</button>
                <button type="button" class="pill-btn" data-q="q3" data-val="no">Not yet</button>
              </div>
            </div>

            <div class="mb-4">
              <label for="fb-comment" class="form-label" data-i18n="fb_comment_label">Additional observations (optional)</label>
              <textarea id="fb-comment" class="form-control" rows="3" placeholder="Tell us about wheelchair accessibility, shade, or rest spots..."></textarea>
            </div>

            <button type="submit" class="colour-btn" style="background-color: var(--mustard); color: var(--near-black);" data-i18n="btn_submit_feedback">Submit Feedback</button>
          </form>
        </div>

        <div id="thank-you-card" class="colour-block p-4 p-md-5 d-none text-center" style="background-color: var(--olive); color: #FFFFFF;">
          <h2 class="display-5 fw-black mb-3" data-i18n="fb_thanks_title">Thank You for Visiting!</h2>
          <p class="fs-5 opacity-90 mb-4" data-i18n="fb_thanks_sub">Your suggestions will keep cultural celebrations safer and more comfortable.</p>
          <a href="choose-festival.html" class="colour-btn" style="background-color: var(--mustard); color: var(--near-black);" data-i18n="btn_plan_another">Plan Another Festival</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
