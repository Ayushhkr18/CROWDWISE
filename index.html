<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrowdWise - Calm Festival Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Special interactive styling for Create Account Card Button */
    .create-account-block {
      background-color: var(--mustard);
      color: var(--near-black);
      border-radius: 18px;
      padding: 1.25rem;
      text-align: center;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      display: block;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
    }
    .create-account-block:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      color: var(--near-black);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }
    .create-account-block:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="split-login-bg">
  <header class="app-header">
    <span class="app-logo">CrowdWise</span>
    <button id="btn-lang-toggle" class="lang-toggle-btn" aria-label="Switch Language">हिन्दी</button>
  </header>

  <main class="container py-4 my-auto">
    <div class="row align-items-center g-4">
      <!-- Left Hero Banner -->
      <div class="col-lg-6">
        <h1 class="login-title mb-3" data-i18n="login_heading">CrowdWise</h1>
        <p class="fs-4 fw-bold" style="color: var(--platinum-silver);" data-i18n="login_sub">
          Plan a peaceful visit to grand celebrations.
        </p>
      </div>

      <!-- Right Form Block Card -->
      <div class="col-lg-6">
        <div class="colour-block login-card p-4 p-md-5">
          <form id="login-form">
            <div id="login-error" class="alert alert-danger d-none py-2 px-3 fw-bold mb-3" role="alert"></div>

            <div class="mb-3">
              <label for="login-email" class="form-label" data-i18n="email_label">Email address</label>
              <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label for="login-pass" class="form-label" data-i18n="password_label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="login-pass" required>
                <button class="btn btn-dark fw-bold px-3" type="button" id="btn-toggle-pass" data-i18n="show_pass">Show</button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember-me" checked>
              <label class="form-check-label fw-bold" for="remember-me" data-i18n="remember_me">Remember this device</label>
            </div>

            <button type="submit" class="colour-btn btn-mocha mb-3" data-i18n="btn_login">Sign In</button>
            <button type="button" id="btn-guest-login" class="colour-btn btn-lavender mb-3" data-i18n="btn_guest">Continue as Guest</button>
            
            <hr class="my-4" style="border-top: 2px solid rgba(20, 18, 17, 0.15);">

            <!-- Prominent Interactive Create Account Block -->
            <div class="text-center">
              <span class="d-block text-secondary fw-bold mb-2 fs-6" data-i18n="new_user_prompt">New to CrowdWise?</span>
              <a href="register.html" class="create-account-block" aria-label="Create a new free account">
                <span class="h5 fw-black m-0 d-block" data-i18n="create_account_link">Create Free Account →</span>
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 text-secondary small">
    <span data-i18n="demo_badge">Sample data for demonstration</span>
  </footer>

  <!-- Direct Floating Lost Child / Companion Button -->
  <a href="emergency.html" class="lost-floating-action" aria-label="Lost child or companion help">
    <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg>
    <span data-i18n="btn_lost_help">Lost Child / Companion Help</span>
  </a>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
