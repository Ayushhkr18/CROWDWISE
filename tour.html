<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to CrowdWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tour-card {
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
      transition: all 0.3s ease;
    }
    .tour-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(20, 18, 17, 0.25);
      display: inline-block;
      margin: 0 5px;
      transition: transform 0.2s, background-color 0.2s;
    }
    .tour-dot.active {
      background: var(--near-black);
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <span class="app-logo">CrowdWise</span>
    <button id="btn-lang-toggle" class="lang-toggle-btn">हिन्दी</button>
  </header>

  <main class="container py-4 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div id="tour-card" class="colour-block tour-card p-4 p-md-5" style="background-color: var(--terracotta);">
          <div>
            <span class="badge bg-dark text-white rounded-pill px-3 py-2 fs-6 mb-4" id="slide-indicator">1 / 4</span>
            <h1 class="display-4 fw-black mb-3" id="tour-title" data-i18n="tour_title_1">Choose your festival</h1>
            <p class="fs-4 fw-medium" id="tour-desc" data-i18n="tour_desc_1">Tailor themes, greetings, and schedules to your chosen celebration.</p>
          </div>

          <div class="mt-4">
            <div class="text-center mb-4" role="tablist" aria-label="Tour slides">
              <span class="tour-dot active" aria-label="Slide 1"></span>
              <span class="tour-dot" aria-label="Slide 2"></span>
              <span class="tour-dot" aria-label="Slide 3"></span>
              <span class="tour-dot" aria-label="Slide 4"></span>
            </div>

            <div class="d-flex gap-3">
              <button id="btn-skip-tour" class="colour-btn" style="background-color: var(--platinum-silver); color: var(--near-black);" data-i18n="btn_skip">Skip Tour</button>
              <button id="btn-next-slide" class="colour-btn" style="background-color: var(--mustard); color: var(--near-black);" data-i18n="btn_next">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <a href="emergency.html" class="lost-floating-action">
    <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg>
    <span data-i18n="btn_lost_help">Lost Child / Companion Help</span>
  </a>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
